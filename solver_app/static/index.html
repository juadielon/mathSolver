<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f1">
    <title>Genius Mathematical Solver</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <a class="brand" href="/" aria-label="Genius solver home">
          <span class="brand-mark" aria-hidden="true">g</span>
          <span>genius</span>
        </a>
        <span class="phase-label">Mathematical solver · Phase 1</span>
      </header>

      <section class="solver-card" aria-labelledby="page-title">
        <p class="eyebrow">A clearer way through the maths</p>
        <h1 id="page-title">Solve an equation, step by step.</h1>
        <p class="intro">Enter a linear or quadratic equation in x to see its solutions and working.</p>

        <form id="solver-form">
          <label for="equation">Your equation</label>
          <div class="input-row">
            <input
              id="equation"
              name="equation"
              type="text"
              value="x^2 + 4 = 0"
              maxlength="512"
              autocomplete="off"
              spellcheck="false"
              aria-describedby="input-help"
              required
            >
            <button type="submit">
              <span>Solve</span>
              <span aria-hidden="true">→</span>
            </button>
          </div>
          <p id="input-help" class="input-help">Try <code>2x + 3 = 7</code> or <code>x^2 + 4 = 0</code>.</p>
        </form>

        <p id="error-message" class="error-message" role="alert" hidden></p>

        <section id="results" class="results" aria-live="polite" hidden>
          <div class="result-heading">
            <div>
              <p class="eyebrow">Solution</p>
              <h2 id="result-title"></h2>
            </div>
            <span id="degree-badge" class="degree-badge"></span>
          </div>
          <ol id="steps" class="steps"></ol>
        </section>
      </section>

      <footer class="page-footer">
        <span>Linear and quadratic equations</span>
        <span>Runs locally in Docker</span>
      </footer>
    </main>
  </body>
</html>
