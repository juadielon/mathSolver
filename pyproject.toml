[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "math-solver"
version = "0.1.0"
description = "A self-contained, step-by-step mathematical solver."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "sympy>=1.13,<2",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "Pillow>=10,<12",
    "unimernet==0.2.3",
    # Keep evaluate's transitive dataset stack compatible with the NumPy 1.x runtime.
    "datasets==3.6.0",
    "pyarrow==20.0.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["solver_app*"]

[tool.setuptools.package-data]
solver_app = ["static/*", "unimernet.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
